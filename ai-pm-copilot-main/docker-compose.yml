version: '3.8'

services:
  # Metadata Database (MongoDB)
  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - copilot_network

  # Caching, Sessions, & Rate Limit State (Redis)
  redis:
    image: redis:7.0-alpine
    container_name: redis_service
    ports:
      - "6379:6379"
    networks:
      - copilot_network

  # Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_service
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - copilot_network

  # AI Reasoning & RAG FastAPI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - HOST=0.0.0.0
      - PORT=8002
    depends_on:
      - qdrant
    networks:
      - copilot_network

  # Express REST Gateway API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/ai_pm_copilot
      - REDIS_URL=redis://redis:6379
      - FASTAPI_URL=http://ai-service:8002
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_long_random_secret_in_production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-d3f4b2a1c0e9f8d7c6b5a4938271605f4e3d2c1b0a9f8e7d6c5b4a3928170f6e}
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
      - ai-service
    networks:
      - copilot_network

networks:
  copilot_network:
    driver: bridge

volumes:
  mongo_data:
  qdrant_storage:
